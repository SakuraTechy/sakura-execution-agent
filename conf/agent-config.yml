# Sakura Execution Agent 配置文件
# 本配置文件优先级低于 JVM 系统属性（-D 参数）

# SSH 连接配置
ssh:
  # 是否跳过主机密钥校验
  # true: 跳过服务器身份校验（仅限受控隔离测试环境）
  # false: 强制校验 known_hosts 文件（生产环境推荐）
  skip-host-key-check: true

  # known_hosts 文件路径（当 skip-host-key-check=false 时必须配置）
  # 可以是绝对路径或相对于 agent 工作目录的路径
  known-hosts: conf/known_hosts

# JDBC 驱动配置
jdbc:
  # JDBC 驱动文件目录
  driver-dir: drivers

# 本地文件操作配置
local-action:
  # 工作空间根目录
  workspace: workspace

  # workspace 已自动授权；额外目录需预先创建且不能是磁盘根、用户主目录或符号链接。
  allow-roots: []

# 日志配置
logging:
  # 日志文件路径
  file: logs/agent.log

# 任务持久化配置
task:
  # 任务账本文件路径
  ledger-file: data/task-ledger.json

# HTTP 服务配置
server:
  # 监听地址
  bind: 127.0.0.1

  # 监听端口
  port: 19091

# 可选功能配置
features:
  # 验证码 OCR 配置（可选）
  captcha-ocr:
    enabled: false
    python: python3
    script: scripts/ocr.py

  # 桌面自动化配置（可选）
  desktop:
    enabled: false

  # 运行时属性白名单（可选）
  # 允许测试用例读取的系统属性或环境变量
  runtime-properties: {}
    # 档案名 -> 允许的属性键列表
    # dev:
    #   - APP_VERSION
    #   - BUILD_NUMBER
